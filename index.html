<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الحديث النبوي الشريف</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #C9A84C;
    --gold-light: #E8D08A;
    --gold-dark: #8B6914;
    --emerald: #1A5C3A;
    --emerald-light: #2A8A5A;
    --emerald-mid: #1E6B44;
    --cream: #FAF6EE;
    --cream-dark: #F0E8D0;
    --ink: #1C1208;
    --ink-soft: #3D2B0E;
    --border-gold: rgba(201, 168, 76, 0.4);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background-color: var(--ink);
    min-height: 100vh;
    font-family: 'Amiri', 'Noto Naskh Arabic', serif;
    overflow-x: hidden;
    position: relative;
  }

  /* Starfield background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(26, 92, 58, 0.18) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 80%, rgba(139, 105, 20, 0.15) 0%, transparent 60%),
      radial-gradient(ellipse at 50% 50%, rgba(28, 18, 8, 1) 0%, #0D0A04 100%);
    z-index: 0;
  }

  #stars-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  .page-wrapper {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 3rem 1.5rem 4rem;
  }

  /* === TOP ORNAMENT === */
  .top-ornament {
    width: 100%;
    max-width: 780px;
    text-align: center;
    margin-bottom: 1.5rem;
    animation: fadeDown 1.2s ease both;
  }

  .bismillah {
    font-family: 'Amiri', serif;
    font-size: clamp(1.8rem, 5vw, 3rem);
    color: var(--gold-light);
    letter-spacing: 0.02em;
    line-height: 1.6;
    text-shadow: 0 0 40px rgba(201,168,76,0.35);
    margin-bottom: 0.5rem;
  }

  .divider-svg {
    width: 340px;
    max-width: 90%;
    margin: 0.5rem auto;
    display: block;
    opacity: 0.85;
  }

  /* === MAIN CARD === */
  .card {
    width: 100%;
    max-width: 780px;
    background: linear-gradient(160deg, #1E1508 0%, #160F05 60%, #1A1306 100%);
    border: 1.5px solid var(--border-gold);
    border-radius: 2px;
    position: relative;
    padding: 0;
    overflow: hidden;
    box-shadow:
      0 0 0 1px rgba(201,168,76,0.08),
      0 0 60px rgba(0,0,0,0.6),
      inset 0 0 80px rgba(201,168,76,0.03);
    animation: fadeUp 1.4s ease 0.3s both;
  }

  /* Corner ornaments */
  .corner {
    position: absolute;
    width: 64px;
    height: 64px;
    z-index: 3;
    pointer-events: none;
  }
  .corner.tl { top: 0; right: 0; }
  .corner.tr { top: 0; left: 0; transform: scaleX(-1); }
  .corner.bl { bottom: 0; right: 0; transform: scaleY(-1); }
  .corner.br { bottom: 0; left: 0; transform: scale(-1,-1); }

  .card-inner {
    padding: 3rem 3.5rem 2.5rem;
    position: relative;
  }

  /* Geometric background pattern */
  .card-inner::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      repeating-linear-gradient(45deg, rgba(201,168,76,0.025) 0px, transparent 1px, transparent 28px, rgba(201,168,76,0.025) 29px),
      repeating-linear-gradient(-45deg, rgba(201,168,76,0.025) 0px, transparent 1px, transparent 28px, rgba(201,168,76,0.025) 29px);
    pointer-events: none;
  }

  /* === HEADER === */
  .header {
    text-align: center;
    margin-bottom: 2.2rem;
    position: relative;
  }

  .title-arabic {
    font-size: clamp(1.1rem, 3vw, 1.5rem);
    color: var(--gold);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-family: 'Noto Naskh Arabic', serif;
    font-weight: 500;
    margin-bottom: 0.4rem;
    opacity: 0.9;
  }

  .subtitle {
    font-size: 0.9rem;
    color: rgba(201,168,76,0.5);
    font-family: 'Amiri', serif;
    font-style: italic;
  }

  /* === HADITH TEXT === */
  .hadith-container {
    position: relative;
    padding: 2.2rem 2.5rem;
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(201,168,76,0.15);
    border-radius: 1px;
    margin-bottom: 2rem;
  }

  .hadith-container::before, .hadith-container::after {
    content: '';
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: 60%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(201,168,76,0.5), transparent);
  }
  .hadith-container::before { top: 0; }
  .hadith-container::after { bottom: 0; }

  .hadith-text {
    font-family: 'Amiri', serif;
    font-size: clamp(1.35rem, 3.5vw, 1.9rem);
    line-height: 2.6;
    color: var(--cream);
    text-align: justify;
    direction: rtl;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    position: relative;
    z-index: 1;
  }

  /* Tashkeel styling — golden diacritics */
  .hadith-text .t { color: var(--gold-light); }

  /* Key phrases glow */
  .hadith-text .highlight {
    color: var(--gold-light);
    text-shadow: 0 0 20px rgba(201,168,76,0.3), 0 1px 3px rgba(0,0,0,0.5);
  }

  /* Opening quote mark */
  .open-quote {
    font-family: 'Amiri', serif;
    font-size: 5rem;
    color: var(--gold);
    opacity: 0.15;
    position: absolute;
    top: -1.2rem;
    right: 1.5rem;
    line-height: 1;
    pointer-events: none;
    user-select: none;
  }

  /* === FOOTER BAR === */
  .hadith-footer {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    padding-top: 1.2rem;
    border-top: 1px solid rgba(201,168,76,0.12);
    flex-wrap: wrap;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: rgba(201,168,76,0.08);
    border: 1px solid rgba(201,168,76,0.2);
    border-radius: 2px;
    padding: 0.35rem 1rem;
    font-size: 0.85rem;
    color: var(--gold-light);
    font-family: 'Noto Naskh Arabic', serif;
    letter-spacing: 0.05em;
  }

  .badge svg { flex-shrink: 0; }

  /* === BOTTOM ORNAMENT === */
  .bottom-section {
    width: 100%;
    max-width: 780px;
    text-align: center;
    margin-top: 1.8rem;
    animation: fadeUp 1.4s ease 0.7s both;
  }

  .dua-label {
    font-size: 0.85rem;
    color: rgba(201,168,76,0.4);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-family: 'Noto Naskh Arabic', serif;
    margin-bottom: 0.6rem;
  }

  .dua-arabic {
    font-family: 'Amiri', serif;
    font-size: 1.1rem;
    color: rgba(201,168,76,0.65);
    letter-spacing: 0.04em;
  }

  /* === FLOATING PARTICLES === */
  .particle {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    animation: floatUp linear infinite;
    z-index: 0;
  }

  @keyframes floatUp {
    0% { opacity: 0; transform: translateY(100vh) scale(0); }
    10% { opacity: 1; }
    90% { opacity: 0.4; }
    100% { opacity: 0; transform: translateY(-10vh) scale(1); }
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-30px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes shimmer {
    0%, 100% { opacity: 0.6; }
    50%       { opacity: 1; }
  }

  /* Responsive */
  @media (max-width: 600px) {
    .card-inner { padding: 2rem 1.5rem; }
    .hadith-container { padding: 1.5rem 1.2rem; }
    .hadith-text { line-height: 2.4; }
  }
</style>
</head>
<body>

<canvas id="stars-canvas"></canvas>

<div class="page-wrapper">

  <!-- Top Bismillah -->

    <div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ</div>

    <!-- Ornamental divider SVG -->
    <svg class="divider-svg" viewBox="0 0 340 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <line x1="0" y1="12" x2="130" y2="12" stroke="url(#grad1)" stroke-width="0.8"/>

      <path d="M162 12 L170 5 L178 12 L170 19 Z" fill="#C9A84C" opacity="0.5"/>

      <line x1="210" y1="12" x2="340" y2="12" stroke="url(#grad2)" stroke-width="0.8"/>
      <defs>

          <stop offset="0%" stop-color="#C9A84C" stop-opacity="0"/>
          <stop offset="100%" stop-color="#C9A84C" stop-opacity="0.7"/>
        </linearGradient>

          <stop offset="100%" stop-color="#C9A84C" stop-opacity="0"/>
        </linearGradient>
      </defs>
    </svg>
  </div>

  <!-- Main Card -->
  <div class="card">
    <!-- Corner ornaments -->
    <svg class="corner tl" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M64 0 Q64 32 32 32 Q0 32 0 64" stroke="#C9A84C" stroke-width="0.8" fill="none" opacity="0.5"/>
      <path d="M64 8 Q56 32 32 40 Q8 48 0 64" stroke="#C9A84C" stroke-width="0.4" fill="none" opacity="0.25"/>
      <circle cx="64" cy="0" r="3" fill="#C9A84C" opacity="0.6"/>

    </svg>
    <svg class="corner tr" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M64 0 Q64 32 32 32 Q0 32 0 64" stroke="#C9A84C" stroke-width="0.8" fill="none" opacity="0.5"/>
      <path d="M64 8 Q56 32 32 40 Q8 48 0 64" stroke="#C9A84C" stroke-width="0.4" fill="none" opacity="0.25"/>
      <circle cx="64" cy="0" r="3" fill="#C9A84C" opacity="0.6"/>
      <circle cx="0" cy="64" r="3" fill="#C9A84C" opacity="0.6"/>
    </svg>
    <svg class="corner bl" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M64 0 Q64 32 32 32 Q0 32 0 64" stroke="#C9A84C" stroke-width="0.8" fill="none" opacity="0.5"/>
      <path d="M64 8 Q56 32 32 40 Q8 48 0 64" stroke="#C9A84C" stroke-width="0.4" fill="none" opacity="0.25"/>

    <svg class="corner br" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M64 0 Q64 32 32 32 Q0 32 0 64" stroke="#C9A84C" stroke-width="0.8" fill="none" opacity="0.5"/>
      <circle cx="64" cy="0" r="3" fill="#C9A84C" opacity="0.6"/>
      <circle cx="0" cy="64" r="3" fill="#C9A84C" opacity="0.6"/>
    </svg>

    <div class="card-inner">

      <div class="header">
        <div class="title-arabic">الحَدِيثُ النَّبَوِيُّ الشَّرِيف</div>

      </div>

      <div class="hadith-container">

  <!-- Bottom -->
  <div class="bottom-section">

</div>

<script>
// ---- HADITH TEXT with tashkeel ----
const hadithLines = [
  "اللَّهُمَّ أَنْتَ أَحَقُّ مَنْ ذُكِرَ، وَأَحَقُّ مَنْ عُبِدَ، وَأَكْرَمُ مَنِ ابْتُغِيَ،",
  "وَأَرْأَفُ مَنْ مَلَكَ، وَأَجْوَدُ مَنْ سُئِلَ، وَأَوْسَعُ مَنْ أَعْطَى،",
  "أَنْتَ الْمَلِكُ لَا شَرِيكَ لَكَ، وَالْفَرْدُ لَا نِدَّ لَكَ،",
  "كُلُّ شَيْءٍ هَالِكٌ إِلَّا وَجْهَكَ،",
  "لَنْ تُطَاعَ إِلَّا بِإِذْنِكَ، وَلَنْ تُعْصَى إِلَّا بِعِلْمِكَ،",
  "أَقْرَبُ شَهِيدٍ، وَأَدْنَى حَفِيظٍ،",
  "الْقُلُوبُ لَكَ مُفْضِيَةٌ، وَالسِّرُّ عِنْدَكَ عَلَانِيَةٌ،",
  "الْحَلَالُ مَا أَحْلَلْتَ، وَالْحَرَامُ مَا حَرَّمْتَ،",
  "وَالدِّينُ مَا شَرَعْتَ، وَالْأَمْرُ مَا قَضَيْتَ،",
  "وَالْخَلْقُ خَلْقُكَ، وَالْعَبْدُ عَبْدُكَ،",
  "وَأَنْتَ اللهُ الرَّؤُوفُ الرَّحِيمُ،",
  "أَسْأَلُكَ بِكُلِّ حَقٍّ هُوَ لَكَ، وَبِحَقِّ السَّائِلِينَ عَلَيْكَ،",
  "أَنْ تَقْبَلَنِي فِي هَذِهِ الْغَدَاةِ،",
  "وَأَنْ تُجِيرَنِي مِنَ النَّارِ بِقُدْرَتِكَ"
];

// Highlights — names of Allah and key phrases
const highlights = ["اللَّهُمَّ", "الْمَلِكُ", "الْفَرْدُ", "وَجْهَكَ", "اللهُ الرَّؤُوفُ الرَّحِيمُ", "أَسْأَلُكَ"];

const container = document.getElementById('hadith-text');

// Build text with animation
let lineIndex = 0;
function renderLine() {
  if (lineIndex >= hadithLines.length) return;
  const line = hadithLines[lineIndex];
  const p = document.createElement('div');
  p.style.cssText = 'opacity:0;transform:translateY(10px);transition:opacity 0.6s ease,transform 0.6s ease;margin-bottom:0.3rem;';

  let html = line;
  highlights.forEach(h => {
    html = html.split(h).join(`<span class="highlight">${h}</span>`);
  });
  p.innerHTML = html;
  container.appendChild(p);

  requestAnimationFrame(() => {
    p.style.opacity = '1';
    p.style.transform = 'translateY(0)';
  });

  lineIndex++;
  if (lineIndex < hadithLines.length) {
    setTimeout(renderLine, 120);
  }
}
setTimeout(renderLine, 800);

// ---- STARS ----
const canvas = document.getElementById('stars-canvas');
const ctx = canvas.getContext('2d');
let W, H, stars = [], shootingStars = [];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', () => { resize(); initStars(); });

function initStars() {
  stars = Array.from({length: 220}, () => ({
    x: Math.random() * W,
    y: Math.random() * H,
    r: Math.random() * 1.2 + 0.2,
    a: Math.random(),
    speed: Math.random() * 0.003 + 0.001,
    phase: Math.random() * Math.PI * 2
  }));
}
initStars();

function spawnShooting() {
  if (Math.random() < 0.3) {
    shootingStars.push({
      x: Math.random() * W,
      y: Math.random() * H * 0.5,
      len: Math.random() * 120 + 60,
      speed: Math.random() * 6 + 4,
      alpha: 1,
      angle: Math.PI / 6 + Math.random() * 0.3
    });
  }
}

let t = 0;
function draw() {
  ctx.clearRect(0, 0, W, H);

  // Stars
  stars.forEach(s => {
    const a = 0.3 + 0.5 * (0.5 + 0.5 * Math.sin(t * s.speed + s.phase));
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,245,210,${a})`;
    ctx.fill();
  });

  // Shooting stars
  shootingStars = shootingStars.filter(ss => ss.alpha > 0.02);
  shootingStars.forEach(ss => {
    const ex = ss.x + Math.cos(ss.angle) * ss.len;
    const ey = ss.y + Math.sin(ss.angle) * ss.len;
    const grad = ctx.createLinearGradient(ss.x, ss.y, ex, ey);
    grad.addColorStop(0, `rgba(255,235,150,0)`);
    grad.addColorStop(0.3, `rgba(255,235,150,${ss.alpha * 0.8})`);
    grad.addColorStop(1, `rgba(255,235,150,0)`);
    ctx.beginPath();
    ctx.moveTo(ss.x, ss.y);
    ctx.lineTo(ex, ey);
    ctx.strokeStyle = grad;
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ss.x += Math.cos(ss.angle) * ss.speed;
    ss.y += Math.sin(ss.angle) * ss.speed;
    ss.alpha *= 0.96;
  });

  t += 1;
  requestAnimationFrame(draw);
}
draw();
setInterval(spawnShooting, 2800);

// ---- FLOATING GOLD PARTICLES ----
function createParticle() {
  const el = document.createElement('div');
  el.className = 'particle';
  const size = Math.random() * 3 + 1;
  const left = Math.random() * 100;
  const dur = Math.random() * 12 + 10;
  const delay = Math.random() * 8;
  el.style.cssText = `
    width:${size}px; height:${size}px;
    left:${left}vw;
    background:rgba(201,168,76,${Math.random()*0.4+0.1});
    animation-duration:${dur}s;
    animation-delay:-${delay}s;
  `;
  document.body.appendChild(el);
}
for (let i = 0; i < 18; i++) createParticle();
</script>
</body>
</html>
